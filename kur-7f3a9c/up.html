<!doctype html><meta charset="utf-8"><title>up</title><body>bekliyor
<script>
window.addEventListener('message',async e=>{const list=e.data;const res=[];
for(const [f,u] of list){try{const b=await fetch('ss/'+f+'?'+Date.now()).then(r=>r.blob());const r=await fetch(u,{method:'PUT',headers:{'Content-Type':'image/png'},body:b});res.push([f,r.status,b.size]);}catch(err){res.push([f,'ERR '+err]);}}
document.body.textContent=JSON.stringify(res);e.source.postMessage({done:res},e.origin);});
if(window.opener)window.opener.postMessage('ready','*');
</script>
