<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1218">
<title>ProGrafik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1218;--pn:#151922;--ln:#262c38;--ink:#d1d4dc;--mu:#8b95a5;--hv:#1e2430;--ac:#2962ff;--up:#089981;--dn:#f23645;--warn:#ff9800}
[data-theme=light]{--bg:#ffffff;--pn:#ffffff;--ln:#e0e3eb;--ink:#131722;--mu:#6a6d78;--hv:#f0f3fa}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:4px;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:48px minmax(0,1fr) 300px;grid-template-rows:44px minmax(0,1fr);height:100vh;height:100dvh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--ln);background:var(--pn);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{flex:none;font-weight:700;color:var(--ac);padding:0 8px 0 4px;white-space:nowrap;font-size:14px}
.brand b{color:var(--ink)}
.hb{height:34px;padding:0 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink);flex:none}
.hb:hover,.tb:hover{background:var(--hv)}
.hb.on{color:var(--ac)}
.hb:disabled{opacity:.35;cursor:default;background:none}
.sym{font-weight:600}
.sp{width:1px;height:22px;background:var(--ln);margin:0 4px;flex:none}
.grow{flex:1}
.tfb{height:30px;padding:0 7px;color:var(--ink);font-weight:500;white-space:nowrap}
.tfb.on{color:var(--ac);background:var(--hv)}
.tfb:hover{background:var(--hv)}
#tools{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tb{width:38px;height:38px;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.tb.on{color:var(--ac);background:var(--hv)}
.tb.grp::after{content:"";position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-right-color:var(--mu);border-bottom-color:var(--mu)}
.tsep{width:26px;height:1px;background:var(--ln);margin:4px 0;flex:none}
#center{display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-height:120px}
#subs{display:flex;flex-direction:column;max-height:62%;overflow-y:auto;flex:none}
.pane{position:relative;border-top:1px solid var(--ln);flex:none}
.rz{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:ns-resize;z-index:6;touch-action:none}
#draw{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:hidden}
#draw.active{pointer-events:all;cursor:crosshair;touch-action:none}
#draw .h{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:move}
#draw .f,#draw .tt{pointer-events:visiblePainted;cursor:move}
#draw .t{pointer-events:none}
#draw .hd{fill:var(--bg);stroke:var(--ac);stroke-width:2;pointer-events:all;cursor:grab}
#draw .pv{pointer-events:none;opacity:.85}
#draw.active .h,#draw.active .f,#draw.active .tt,#draw.active .hd{pointer-events:none}
.lg{position:absolute;left:8px;top:6px;z-index:5;pointer-events:none;font-size:12px;max-width:calc(100% - 100px);max-height:calc(100% - 40px);overflow:hidden}
.plg{max-height:calc(100% - 8px)}
.lg .r1{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.lg .nm{font-size:13px;font-weight:600}
.lg .k{color:var(--mu)}
.ir{display:flex;gap:6px;align-items:center;margin-top:2px;white-space:nowrap}
.ir .in{color:var(--ink)}
.ir.off .in,.ir.off .vv{opacity:.4}
.ib{display:inline-flex;gap:1px;pointer-events:auto;opacity:.55}
.ir:hover .ib,.ib:hover{opacity:1}
.ib button{width:22px;height:22px;display:grid;place-items:center;background:var(--pn);border:1px solid var(--ln)}
.ib svg.i{width:14px;height:14px}
.lgc{pointer-events:auto;margin-top:3px;height:20px;padding:0 6px;border:1px solid var(--ln);background:var(--pn);color:var(--mu);font-size:11px}
.up{color:var(--up)}.dn{color:var(--dn)}
#status{position:absolute;right:86px;top:8px;z-index:5;font-size:11px;color:var(--mu);pointer-events:none;white-space:nowrap}
#status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dn);margin-right:5px}
#status.live i{background:var(--up)}
#bot{height:30px;border-top:1px solid var(--ln);display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--pn);flex:none;overflow-x:auto;scrollbar-width:none}
#bot::-webkit-scrollbar{display:none}
#bot button{flex:none;height:24px;padding:0 7px;color:var(--ink);font-size:12px;white-space:nowrap}
#bot button:hover{background:var(--hv)}
#bot button.on{color:var(--ac)}
#clock{flex:none;color:var(--mu);font-size:12px;white-space:nowrap;padding:0 8px;font-variant-numeric:tabular-nums}
#dtb{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:7;display:none;background:var(--pn);border:1px solid var(--ln);border-radius:6px;box-shadow:0 4px 18px #0006;padding:3px;gap:2px;align-items:center}
#dtb.show{display:flex}
#dtb button{height:30px;min-width:30px;display:grid;place-items:center;padding:0 4px}
#dtb button:hover{background:var(--hv)}
#dtb button.on{background:var(--hv);color:var(--ac)}
.sw{width:16px;height:16px;border-radius:3px;border:1px solid #fff4}
#rbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:8;display:none;background:var(--pn);border:1px solid var(--ln);border-radius:8px;box-shadow:0 4px 18px #0007;padding:4px;gap:2px;align-items:center}
#rbar.show{display:flex}
#rbar button{height:32px;min-width:34px;padding:0 8px;display:grid;place-items:center}
#rbar button:hover{background:var(--hv)}
#rbar .rt{color:var(--mu);font-size:12px;padding:0 8px;white-space:nowrap}
#rhint{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:8;background:var(--ac);color:#fff;padding:6px 12px;border-radius:6px;display:none;font-size:12px;pointer-events:none;white-space:nowrap}
aside{border-left:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;min-height:0}
.stabs{display:flex;border-bottom:1px solid var(--ln);flex:none}
.stabs button{flex:1;height:38px;color:var(--mu);font-weight:500;border-radius:0}
.stabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--ac)}
.spane{display:none;flex-direction:column;flex:1;min-height:0}
.spane.on{display:flex}
.wlh{display:grid;grid-template-columns:minmax(0,1fr) 84px 64px 26px;gap:6px;padding:6px 10px;color:var(--mu);font-size:11px;flex:none;align-items:center}
.wlh button{width:26px;height:26px;display:grid;place-items:center;color:var(--ink)}
#wl{overflow-y:auto;flex:1 1 50%;min-height:120px}
.wi{display:grid;grid-template-columns:minmax(0,1fr) 84px 64px 26px;gap:6px;align-items:center;padding:0 10px;height:30px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:12px}
.wi:hover,.wi.on{background:var(--hv)}
.wi .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi .n small{color:var(--mu);font-weight:400;margin-left:3px}
.wi .p,.wi .c{text-align:right;white-space:nowrap}
.wi .x{opacity:0;color:var(--mu);width:22px;height:22px;display:grid;place-items:center}
.wi:hover .x{opacity:1}
#det{border-top:1px solid var(--ln);padding:12px;overflow-y:auto;flex:0 1 auto;max-height:50%}
#det .dn1{color:var(--mu);font-size:12px}
#det .pr{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
#det .ch{font-weight:600;font-variant-numeric:tabular-nums}
#det dl{display:grid;grid-template-columns:auto auto;gap:6px 10px;margin:12px 0 0;font-size:12px}
#det dt{color:var(--mu)}#det dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rng{height:4px;background:var(--ln);border-radius:2px;position:relative;margin:14px 0 4px}
.rng i{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink)}
.rngl{display:flex;justify-content:space-between;color:var(--mu);font-size:11px}
#al{overflow-y:auto;flex:1;padding:6px 0}
.ali{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--ln);font-size:12px}
.ali .a1{font-weight:600}.ali .a2{color:var(--mu)}
.ali.done{opacity:.5}
.ali .ab{grid-row:1/3;grid-column:2;display:flex;gap:2px;align-items:center}
.ali .ab button{width:28px;height:28px;display:grid;place-items:center}
.empty{color:var(--mu);padding:24px 16px;text-align:center;font-size:12px}
.btn{height:34px;padding:0 14px;border-radius:6px;background:var(--ac);color:#fff;font-weight:600}
.btn.g{background:var(--hv);color:var(--ink)}
.btn.r{background:var(--dn)}
.modal{position:fixed;inset:0;background:#0009;display:none;z-index:30;align-items:flex-start;justify-content:center;padding:56px 12px 12px}
.modal.show{display:flex}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;width:min(560px,100%);max-height:calc(100dvh - 80px);display:flex;flex-direction:column;box-shadow:0 10px 40px #0008}
.box.sm{width:min(380px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--ln);font-size:15px;font-weight:600;flex:none}
.mh button{width:32px;height:32px;display:grid;place-items:center}
.mb{padding:14px;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--ln);flex:none}
.fld{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:10px}
.fld label{color:var(--mu)}
.fld input,.fld select,.fld textarea,.srch{background:var(--bg);border:1px solid var(--ln);color:var(--ink);font:inherit;font-size:16px;padding:7px 9px;border-radius:6px;width:100%}
.fld input[type=color]{height:34px;padding:2px;width:60px}
.fld input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.srch{margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{height:28px;padding:0 10px;border:1px solid var(--ln);border-radius:14px;color:var(--mu)}
.chips button.on{border-color:var(--ac);color:var(--ink);background:var(--hv)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer}
.li:hover,.li.sel{background:var(--hv)}
.li small{color:var(--mu)}
.li .tag{font-size:10px;border:1px solid var(--ln);border-radius:3px;padding:1px 4px;color:var(--mu)}
.pop{position:fixed;z-index:25;background:var(--pn);border:1px solid var(--ln);border-radius:8px;box-shadow:0 8px 28px #0008;padding:4px;display:none;min-width:200px;max-height:70vh;overflow-y:auto}
.pop.show{display:block}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;text-align:left;white-space:nowrap}
.pop button:hover{background:var(--hv)}
.pop button.on{color:var(--ac)}
.pop button kbd{margin-left:auto;color:var(--mu);font:11px Inter,sans-serif;padding-left:16px}
.pop .ph{padding:6px 10px 2px;color:var(--mu);font-size:11px}
#toasts{position:fixed;right:12px;bottom:12px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--ac);border-radius:6px;padding:10px 12px;box-shadow:0 6px 22px #0008;font-size:12px;cursor:pointer}
.toast b{display:block;font-size:13px;margin-bottom:2px}
.toast.al{border-left-color:var(--warn)}
#mtabs{display:none}
@media(max-width:860px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 44px 48px}
 #center{grid-row:2}
 #tools{grid-row:3;flex-direction:row;border:0;border-top:1px solid var(--ln);padding:0 4px;overflow-x:auto;overflow-y:hidden}
 .tsep{width:1px;height:24px;margin:0 4px}
 aside{position:fixed;left:0;right:0;top:44px;bottom:48px;z-index:20;display:none;border:0}
 aside.show{display:flex}
 #mtabs{display:flex;grid-row:4;border-top:1px solid var(--ln);background:var(--pn)}
 #mtabs button{flex:1;color:var(--mu);font-weight:500;border-radius:0}
 #mtabs button.on{color:var(--ac)}
 .hb .lbl{display:none}
 .brand{display:none}
 #status{right:80px;font-size:0}
 .lg{max-width:calc(100% - 90px)}
 .fld{grid-template-columns:110px minmax(0,1fr)}
 #toasts{left:12px;right:12px;bottom:100px;max-width:none}
}
@media(prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div id="app">
<header id="top">
 <span class="brand" id="brand"></span>
 <button class="hb sym" id="symBtn" title="Sembol ara"><i data-ic="search"></i><span id="symTxt">BTCUSDT.P</span></button>
 <i class="sp"></i>
 <div id="tfFav" style="display:flex;gap:1px;flex:none"></div>
 <button class="hb" id="tfMore" title="Tüm zaman dilimleri"><i data-ic="chev"></i></button>
 <i class="sp"></i>
 <button class="hb" id="typeBtn" title="Grafik tipi"><i data-ic="candle"></i></button>
 <i class="sp"></i>
 <button class="hb" id="indBtn" title="Göstergeler"><i data-ic="fx"></i><span class="lbl">Göstergeler</span></button>
 <button class="hb" id="alarmBtn" title="Alarm oluştur"><i data-ic="alarm"></i><span class="lbl">Alarm</span></button>
 <button class="hb" id="replayBtn" title="Tekrar oynat"><i data-ic="replay"></i><span class="lbl">Tekrar oynat</span></button>
 <i class="sp"></i>
 <button class="hb" id="undoBtn" title="Geri al (Ctrl+Z)"><i data-ic="undo"></i></button>
 <button class="hb" id="redoBtn" title="Yinele (Ctrl+Y)"><i data-ic="redo"></i></button>
 <div class="grow"></div>
 <button class="hb" id="cfgBtn" title="Ayarlar"><i data-ic="gear"></i></button>
 <button class="hb" id="shotBtn" title="Ekran görüntüsü al"><i data-ic="camera"></i></button>
 <button class="hb" id="fsBtn" title="Tam ekran"><i data-ic="full"></i></button>
</header>
<nav id="tools"></nav>
<section id="center">
 <div id="main">
  <div class="lg" id="lg"></div>
  <div id="status"><i></i>bağlanıyor</div>
  <svg id="draw"></svg>
  <div id="dtb"></div>
  <div id="rhint">Tekrar oynatmanın başlayacağı mumu seçin</div>
  <div id="rbar"></div>
 </div>
 <div id="subs"></div>
 <footer id="bot"></footer>
</section>
<aside id="side">
 <div class="stabs"><button class="on" data-st="wl">İzleme listesi</button><button data-st="al">Alarmlar</button></div>
 <div class="spane on" id="sp-wl">
  <div class="wlh"><span>Sembol</span><span style="text-align:right">Son</span><span style="text-align:right">Değ%</span><button id="addWl" title="Sembol ekle"><i data-ic="plus"></i></button></div>
  <div id="wl"></div>
  <div id="det"></div>
 </div>
 <div class="spane" id="sp-al">
  <div style="padding:10px 12px;flex:none"><button class="btn" id="newAlarm">+ Alarm oluştur</button></div>
  <div id="al"></div>
 </div>
</aside>
<div id="mtabs"><button class="on" data-m="chart">Grafik</button><button data-m="side">Liste</button></div>
</div>

<div class="modal" id="mSym"><div class="box"><div class="mh"><span id="mSymT">Sembol ara</span><button data-close><i data-ic="x"></i></button></div>
 <div class="mb"><input class="srch" id="q" placeholder="Sembol ara, ör. BTC, ETH, SOL" autocomplete="off" spellcheck="false">
 <div class="chips" id="qtab"><button class="on" data-m="">Tümü</button><button data-m="F">Vadeli (Perp)</button><button data-m="S">Spot</button></div>
 <div id="qlist"></div></div></div></div>

<div class="modal" id="mInd"><div class="box"><div class="mh"><span>Göstergeler</span><button data-close><i data-ic="x"></i></button></div>
 <div class="mb"><input class="srch" id="iq" placeholder="Gösterge ara" autocomplete="off" spellcheck="false">
 <div class="chips" id="icat"></div><div id="ilist"></div></div></div></div>

<div class="modal" id="mDlg"><div class="box sm"><div class="mh"><span id="dlgT"></span><button data-close><i data-ic="x"></i></button></div>
 <div class="mb" id="dlgB"></div><div class="mf" id="dlgF"></div></div></div>

<div class="pop" id="pop"></div>
<div id="toasts"></div>

<script>
{
const APP_NAME='ProGrafik'; // uygulama adı: yalnızca burayı değiştirin
const LC=window.LightweightCharts;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ls={get(k,d){try{const v=localStorage.getItem('otc_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('otc_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));

// ---------------- ikonlar ----------------
const IC={search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',chev:'<path d="M7 10l5 5 5-5"/>',
candle:'<path d="M7 3v4M7 17v4M17 3v3M17 16v5"/><rect x="5" y="7" width="4" height="10"/><rect x="15" y="6" width="4" height="10"/>',
bar:'<path d="M7 4v16M4 8h3M7 15h3M17 4v16M14 7h3M17 13h3"/>',line:'<path d="M3 17l5-6 4 3 8-9"/>',area:'<path d="M3 17l5-6 4 3 8-9v15H3z"/>',
base:'<path d="M3 12h18" stroke-dasharray="2 2"/><path d="M3 15l4-6 4 4 4-7 6 5"/>',ha:'<rect x="5" y="8" width="4" height="9"/><rect x="15" y="5" width="4" height="9"/><path d="M7 5v3M17 3v2M17 14v4"/>',
hollow:'<rect x="5" y="7" width="4" height="10"/><rect x="15" y="6" width="4" height="10" fill="currentColor"/><path d="M7 3v4M7 17v4M17 3v3M17 16v5"/>',
fx:'<path d="M5 20c3 0 2-16 6-16M6 10h6M13 11l6 7M19 11l-6 7"/>',alarm:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M4 4l3-2M20 4l-3-2"/>',
replay:'<path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/>',undo:'<path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-4"/>',redo:'<path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h4"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/>',full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3 3.5M6.6 6.6C3.8 8.4 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 4.4-1"/>',

const N=n=>new Array(n).fill(null);
const zip=(a,b,f)=>a.map((x,i)=>x==null||b[i]==null?null:f(x,b[i],i));
function sma(v,n){const o=N(v.length);let s=0,c=0;for(let i=0;i<v.length;i++){const x=v[i];if(x==null){s=0;c=0;continue}s+=x;c++;if(c>n){s-=v[i-n];c=n}if(c===n)o[i]=s/n}return o}
function ema(v,n){const a=2/(n+1),o=N(v.length);let p=null,c=0;for(let i=0;i<v.length;i++){const x=v[i];if(x==null)continue;p=p==null?x:a*x+(1-a)*p;c++;if(c>=n)o[i]=p}return o}
function rma(v,n){const o=N(v.length);let p=null,c=0,s=0;for(let i=0;i<v.length;i++){const x=v[i];if(x==null)continue;c++;if(p==null){s+=x;if(c===n){p=s/n;o[i]=p}}else{p=(p*(n-1)+x)/n;o[i]=p}}return o}
function wma(v,n){const o=N(v.length),d=n*(n+1)/2;for(let i=n-1;i<v.length;i++){let s=0,ok=true;for(let j=0;j<n;j++){const x=v[i-j];if(x==null){ok=false;break}s+=x*(n-j)}if(ok)o[i]=s/d}return o}
function stdev(v,n){const m=sma(v,n);return m.map((mu,i)=>{if(mu==null)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=(v[j]-mu)**2;return Math.sqrt(s/n)})}
function hh(v,n){return v.map((_,i)=>{if(i<n-1)return null;let m=-Infinity;for(let j=i-n+1;j<=i;j++){if(v[j]==null)return null;if(v[j]>m)m=v[j]}return m})}
function ll(v,n){return v.map((_,i)=>{if(i<n-1)return null;let m=Infinity;for(let j=i-n+1;j<=i;j++){if(v[j]==null)return null;if(v[j]<m)m=v[j]}return m})}
const sumN=(v,n)=>sma(v,n).map(x=>x==null?null:x*n);
const trf=x=>x.h.map((h,i)=>i?Math.max(h-x.l[i],Math.abs(h-x.c[i-1]),Math.abs(x.l[i]-x.c[i-1])):h-x.l[i]);

function rsiF(c,n){const g=c.map((x,i)=>i&&x!=null&&c[i-1]!=null?Math.max(x-c[i-1],0):null),l=c.map((x,i)=>i&&x!=null&&c[i-1]!=null?Math.max(c[i-1]-x,0):null);return zip(rma(g,n),rma(l,n),(a,b)=>b===0?100:a===0?0:100-100/(1+a/b))}
function stochRaw(src,h,l,n){const H=hh(h,n),L=ll(l,n);return src.map((v,i)=>v==null||H[i]==null?null:H[i]-L[i]===0?50:100*(v-L[i])/(H[i]-L[i]))}
const colsHist=(v,pu,pd,nu,nd)=>v.map((x,i)=>x==null?null:x>=0?(i&&v[i-1]!=null&&x<v[i-1]?pd:pu):(i&&v[i-1]!=null&&x>v[i-1]?nd:nu));
function psarF(x,p){const n=x.c.length,o=N(n);if(n<3)return{v:o};let up=x.c[1]>=x.c[0],af=p.start,ep=up?x.h[0]:x.l[0],sar=up?x.l[0]:x.h[0];
 for(let i=1;i<n;i++){sar=sar+af*(ep-sar);
  if(up){sar=Math.min(sar,x.l[i-1],x.l[Math.max(0,i-2)]);if(x.l[i]<sar){up=false;sar=ep;ep=x.l[i];af=p.start}else if(x.h[i]>ep){ep=x.h[i];af=Math.min(af+p.inc,p.max)}}

function pivF(x){const o={P:[],R1:[],R2:[],R3:[],S1:[],S2:[],S3:[]};let day=null,cur=null,prev=null;
 x.t.forEach((t,i)=>{const d=Math.floor(t/86400);if(d!==day){if(cur)prev=cur;cur={h:x.h[i],l:x.l[i],c:x.c[i]};day=d}else{cur.h=Math.max(cur.h,x.h[i]);cur.l=Math.min(cur.l,x.l[i]);cur.c=x.c[i]}
  if(!prev){for(const k in o)o[k].push(null);return}const P=(prev.h+prev.l+prev.c)/3,r=prev.h-prev.l;
  o.P.push(P);o.R1.push(2*P-prev.l);o.S1.push(2*P-prev.h);o.R2.push(P+r);o.S2.push(P-r);o.R3.push(prev.h+2*(P-prev.l));o.S3.push(prev.l-2*(prev.h-P))});return o}
function dmiF(x,p){const n=x.c.length,up=x.h.map((h,i)=>i?h-x.h[i-1]:null),dn=x.l.map((l,i)=>i?x.l[i-1]-l:null);
 const pdm=up.map((u,i)=>u==null?null:u>dn[i]&&u>0?u:0),mdm=dn.map((d,i)=>d==null?null:d>up[i]&&d>0?d:0);
 const atr=rma(trf(x).map((v,i)=>i?v:null),p.len),pl=zip(rma(pdm,p.len),atr,(a,b)=>b?100*a/b:0),mi=zip(rma(mdm,p.len),atr,(a,b)=>b?100*a/b:0);

const DEF=Object.fromEntries(DEFS.map(d=>[d.id,d]));

if(!Array.isArray(S.inds))S.inds=[newInst('vol'),newInst('ema',{p:{len:20},c:{v:'#f7a600'}}),newInst('ema',{p:{len:50},c:{v:'#2962ff'}}),newInst('ema',{p:{len:200},c:{v:'#e040fb'}}),newInst('rsi')];

let R={}; // u -> {inst,def,chart,pane,series,out}
function timeAt(i){const d=S.data,n=d.length;if(!n)return 0;const st=stepSec();return i<n?(i<0?d[0].time+i*st:d[i].time):d[n-1].time+(i-n+1)*st}
function stepSec(){const d=S.data;return d.length>1?d[d.length-1].time-d[d.length-2].time:(TFSEC[S.tf]||60)}
function addPlot(chart,pl,inst,def){
 const col=inst.c?.[pl.k]||pl.c,b={priceLineVisible:false,lastValueVisible:def.pane===1&&pl.t!=='hist',crosshairMarkerVisible:false,visible:!inst.hide};
 if(pl.scale)b.priceScaleId=pl.scale;
 if(def.pane===0&&!pl.scale)b.priceFormat=pf();
 else if(def.pane===1){const dp=def.dp==='main'?S.prec:def.dp??2;b.priceFormat=def.big?{type:'volume'}:{type:'price',precision:dp,minMove:1/10**dp}}
 else if(def.big)b.priceFormat={type:'volume'};
 if(pl.t==='hist')return chart.addHistogramSeries({...b,color:col});
 if(pl.t==='dots')return chart.addLineSeries({...b,color:col,lineVisible:false,pointMarkersVisible:true,pointMarkersRadius:2});
 return chart.addLineSeries({...b,color:col,lineWidth:pl.w||1,lineType:pl.t==='step'?1:0});
}
function newPane(inst,def){
 const el=document.createElement('div');el.className='pane';el.dataset.u=inst.u;
 el.style.height=(inst.h||(innerWidth<860?100:130))+'px';
 el.innerHTML='<div class="rz"></div><div class="lg plg"></div>';$('#subs').appendChild(el);
 const dp=def.dp==='main'?null:def.big?0:(def.dp??2);
 const chart=LC.createChart(el,chartOpts(true,dp));
 const ghost=chart.addLineSeries({lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false,color:'rgba(0,0,0,0)'});
 const p={u:inst.u,el,chart,ghost,def};subs.push(p);hookRange(chart);hookCross(chart,p);
 const rz=el.querySelector('.rz');
 rz.addEventListener('pointerdown',e=>{rz.setPointerCapture(e.pointerId);const y0=e.clientY,h0=el.offsetHeight;
  const mv=ev=>{el.style.height=Math.max(50,Math.min(innerHeight*.6,h0-(ev.clientY-y0)))+'px'};
  const upf=()=>{rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',upf);inst.h=el.offsetHeight;saveInds()};
  rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',upf)});
 return p;
}
function rebuildInds(){
 for(const u in R){const r=R[u];if(r.def.pane===0)for(const k in r.series){try{main.removeSeries(r.series[k])}catch(e){}}}
 R={};
 subs.splice(0).forEach(p=>{try{p.chart.remove()}catch(e){}p.el.remove()});
 S.inds.forEach(inst=>{const def=DEF[inst.id];let chart=main,pane=null;
  if(def.pane===1){pane=newPane(inst,def);chart=pane.chart}
  const r={inst,def,chart,pane,series:{},out:null};
  def.pl.forEach(pl=>{r.series[pl.k]=addPlot(chart,pl,inst,def)});
  if(def.pl.some(pl=>pl.scale==='vol'))main.priceScale('vol').applyOptions({scaleMargins:{top:.8,bottom:0}});
  if(def.lv){const s=r.series[def.pl[def.pl.length-1].k];def.lv.forEach(l=>s.createPriceLine({price:l,color:'#787b86',lineStyle:2,lineWidth:1,axisLabelVisible:false}))}
  R[inst.u]=r});
 // zaman ekseni yalnızca en alttaki panelde görünsün
 fitPanes();
 main.applyOptions({timeScale:{visible:!subs.length}});
 subs.forEach((p,i)=>p.chart.applyOptions({timeScale:{visible:i===subs.length-1}}));
 computeAll(true);
 const r=main.timeScale().getVisibleLogicalRange();if(r)subs.forEach(p=>p.chart.timeScale().setVisibleLogicalRange(r));
 legend();
}
function fitPanes(){const n=subs.length;if(!n)return;const avail=($('#center').clientHeight-30)*.6;subs.forEach(p=>{const inst=S.inds.find(i=>i.u===p.u);const want=inst?.h||(innerWidth<860?100:130);p.el.style.height=Math.max(48,Math.min(want,avail/n))+'px'})}
addEventListener('resize',()=>fitPanes());
function srcOf(d){return{t:d.map(c=>c.time),o:d.map(c=>c.open),h:d.map(c=>c.high),l:d.map(c=>c.low),c:d.map(c=>c.close),v:d.map(c=>c.volume)}}
function toPts(arr,off,cols,pl){const o=[];let started=false;for(let i=0;i<arr.length;i++){const j=i+off;if(j<0)continue;const v=arr[i];
 if(v==null||!isFinite(v)){if(pl.gap&&started)o.push({time:timeAt(j)});continue}started=true;const p={time:timeAt(j),value:v};if(cols&&cols[i])p.color=cols[i];o.push(p)}return o}
function computeAll(full){
 const d=S.data;if(!d.length)return;const x=srcOf(d),n=d.length;
 for(const u in R){const r=R[u];let out;try{out=r.def.f(x,r.inst.p)}catch(e){console.error(e);continue}r.out=out;
  r.def.pl.forEach(pl=>{const s=r.series[pl.k],arr=out[pl.k];if(!s||!arr)return;const off=pl.off?pl.off(r.inst.p):0,cols=out[pl.k+'C'];
   if(full){s.setData(toPts(arr,off,cols,pl));return}
   const i=n-1,j=i+off;if(j<0)return;const v=arr[i];
   try{if(v==null||!isFinite(v)){if(pl.gap)s.update({time:timeAt(j)})}else{const p={time:timeAt(j),value:v};if(cols&&cols[i])p.color=cols[i];s.update(p)}}
   catch(e){s.setData(toPts(arr,off,cols,pl))}})}
 subs.forEach(p=>{if(full)p.ghost.setData(d.map(c=>({time:c.time})));else{try{p.ghost.update({time:d[n-1].time})}catch(e){}}});
}

function computeSoon(){if(ctTimer)return;ctTimer=setTimeout(()=>{ctTimer=null;computeAll(false);if(S.hover==null)legend()},200)}

function valAt(r,pl,i){const off=pl.off?pl.off(r.inst.p):0,arr=r.out?.[pl.k];if(!arr)return null;const v=arr[i-off];return v==null||!isFinite(v)?null:v}

 const i=S.hover!=null&&S.hover>=0&&S.hover<d.length?S.hover:d.length-1,c=d[i],up=c.close>=c.open,cl=up?'up':'dn',ch=c.close-c.open,chp=ch/c.open*100,tfl=TFS.find(t=>t[0]===S.tf)?.[1]||S.tf;

 <span><span class="k">A</span> <span class="${cl}">${fmt(c.open)}</span></span><span><span class="k">Y</span> <span class="${cl}">${fmt(c.high)}</span></span>
 <span><span class="k">D</span> <span class="${cl}">${fmt(c.low)}</span></span><span><span class="k">K</span> <span class="${cl}">${fmt(c.close)}</span></span>
 <span class="${cl}">${ch>=0?'+':''}${fmt(ch)} (${pct(chp)})</span><span><span class="k">Hac</span> ${fmtBig(c.volume)}</span></div>`;
 const ov=Object.values(R).filter(r=>r.def.pane===0);
 if(ov.length){if(S.lgOpen)h+=ov.map(r=>indRow(r,i)).join('');h+=`<button class="lgc" data-act="lgt">${S.lgOpen?'▴ Gizle':'▾ '+ov.length+' gösterge'}</button>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
 if(act==='lgt'){S.lgOpen=!S.lgOpen;legend();return}
 const u=b.closest('[data-u]')?.dataset.u,inst=S.inds.find(x=>x.u===u);if(!inst)return;
 if(act==='eye'){inst.hide=!inst.hide;saveInds();const r=R[u];if(r)for(const k in r.series)r.series[k].applyOptions({visible:!inst.hide});legend()}

function hookCross(c,pane){c.subscribeCrosshairMove(p=>{
 const lg=p.logical!=null&&p.point?Math.round(p.logical):null;
 if(S.hover!==lg){S.hover=lg;legend()}
 if(!p.sourceEvent)return;
 charts().forEach(o=>{if(o===c)return;try{if(p.time==null){o.clearCrosshairPosition();return}
  if(o===main){const v=S.data[lg];if(v)main.setCrosshairPosition(v.close,p.time,mainS)}
  else{const sp=subs.find(s=>s.chart===o),r=R[sp.u];const pl=r.def.pl[r.def.pl.length-1];const v=valAt(r,pl,lg);o.setCrosshairPosition(v??0,p.time,r.series[pl.k])}}catch(e){}})})}

function finish(){const d=S.pending;S.pending=null;if(!d)return;
 if(d.type==='long'||d.type==='short'){const e=d.pts[0],k=d.type==='long'?1:-1,tEnd=l2t(t2l(e.t)+25);d.pts=[e,{t:tEnd,p:e.p*(1+k*.02)},{t:e.t,p:e.p*(1-k*.01)}]}

  if(tool==='zoom'){S.zoom={x0:p.x,x1:p.x};svg.setPointerCapture(e.pointerId);return}

  if(tool==='brush'){S.pending={id:uid(),type:'brush',pts:[fromScreen(p.x,p.y,false)],st:defSt('brush')};S.brushing=true;svg.setPointerCapture(e.pointerId);dirty();return}
  if(!S.pending){S.pending={id:uid(),type:tool,pts:[pt],st:defSt(tool)};if(NEED[tool]===1){finish();return}S.pending.pts.push({...pt});dirty();return}

 if(d.type==='channel'){if(h===2){P[2].p=np.p;return}if(h===0){const off=P[2].p-P[0].p;P[0]={...np};P[2]={t:np.t,p:np.p+off};return}}

  dtb.innerHTML=COLORS.map(c=>`<button data-dc="${c}" title="Renk"><span class="sw" style="background:${c};${st.c===c?'outline:2px solid var(--ac);outline-offset:1px':''}"></span></button>`).join('')+
  `<i class="sp"></i>${[1,2,3,4].map(w=>`<button data-dw="${w}" class="${st.w===w?'on':''}" title="Kalınlık ${w}"><svg width="18" height="18"><line x1="2" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="${w}"/></svg></button>`).join('')}
  <i class="sp"></i>${[0,1,2].map(s=>`<button data-ds="${s}" class="${(st.s||0)===s?'on':''}" title="${['Düz','Kesikli','Noktalı'][s]}"><svg width="18" height="18"><line x1="1" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="2" stroke-dasharray="${['','5 3','1.5 2.5'][s]}"/></svg></button>`).join('')}
  <i class="sp"></i>${d.type==='text'?`<button data-da="edit" title="Metni düzenle">${ic('edit')}</button>`:''}${['hline','hray'].includes(d.type)?`<button data-da="alarm" title="Bu fiyata alarm kur">${ic('bell')}</button>`:''}
  <button data-da="lock" class="${d.lock?'on':''}" title="${d.lock?'Kilidi aç':'Kilitle'}">${ic(d.lock?'lock':'unlock')}</button><button data-da="copy" title="Kopyala">${ic('copy')}</button><button data-da="del" title="Sil (Delete)">${ic('trash')}</button>`}
 dtb.classList.add('show')}
dtb.addEventListener('click',e=>{const b=e.target.closest('button');const d=S.draws.find(x=>x.id===S.sel);if(!b||!d)return;snap();d.st=d.st||defSt(d.type);
 if(b.dataset.dc)d.st.c=b.dataset.dc;if(b.dataset.dw)d.st.w=+b.dataset.dw;if(b.dataset.ds)d.st.s=+b.dataset.ds;
 const a=b.dataset.da;if(a==='del'){S.draws=S.draws.filter(x=>x!==d);S.sel=null}if(a==='lock')d.lock=!d.lock;
 if(a==='copy'){const n=clone(d);n.id=uid();n.lock=false;n.pts=n.pts.map(q=>({t:l2t(t2l(q.t)+5),p:q.p}));S.draws.push(n);S.sel=n.id}
 if(a==='edit'){S.hist.u.pop();editText(d);return}if(a==='alarm'){S.hist.u.pop();alarmDlg(d.pts[0].p);return}
 saveDraws();dirty()});
function editText(d,isNew){dialog('Metin',`<div class="fld" style="grid-template-columns:1fr"><textarea id="txIn" rows="3">${esc(d.text||'')}</textarea></div>`,[{t:'Vazgeç',cls:'g',f:()=>{if(isNew&&!d.text){S.draws=S.draws.filter(x=>x!==d);saveDraws();dirty()}}},{t:'Tamam',f:()=>{const v=$('#txIn').value.trim();if(!v){if(isNew){S.draws=S.draws.filter(x=>x!==d)}}else d.text=v;saveDraws();dirty()}}])}

// ---------------- alarmlar ----------------
let alarmLines=[];
function refreshAlarmLines(){if(!mainS)return;alarmLines.forEach(l=>{try{mainS.removePriceLine(l)}catch(e){}});
 alarmLines=S.alarms.filter(a=>a.k===S.key&&a.on).map(a=>mainS.createPriceLine({price:a.p,color:'#ff9800',lineStyle:2,lineWidth:1,axisLabelVisible:true,title:'Alarm'}))}
const CONDS={up:'Yukarı keserse',down:'Aşağı keserse',cross:'Keserse (her iki yön)'};
function alarmDlg(price,edit){const k=edit?edit.k:S.key,t=S.tick[k],p=price??edit?.p??t?.c??S.full.at(-1)?.close??0,dp=precOf(k);
 dialog(edit?'Alarmı düzenle':'Alarm oluştur',`<div class="fld"><label>Sembol</label><b>${esc(lbl(k))}</b></div>
 <div class="fld"><label for="aC">Koşul</label><select id="aC">${Object.entries(CONDS).map(([v,n])=>`<option value="${v}"${(edit?.c||'cross')===v?' selected':''}>${n}</option>`).join('')}</select></div>
 <div class="fld"><label for="aP">Fiyat</label><input id="aP" type="number" step="any" value="${(+p).toFixed(dp)}"></div>
 <div class="fld"><label for="aM">Mesaj</label><input id="aM" type="text" maxlength="80" value="${esc(edit?.msg||'')}" placeholder="İsteğe bağlı"></div>
 <p style="color:var(--mu);font-size:12px;margin:4px 0 0">Alarm, bu sayfa açıkken çalışır: ekranda bildirim + sesli uyarı verir.</p>`,
 [{t:'Vazgeç',cls:'g'},{t:edit?'Kaydet':'Oluştur',f:()=>{const pv=parseFloat($('#aP').value);if(!isFinite(pv)||pv<=0){toast('Geçersiz fiyat','Lütfen geçerli bir fiyat girin.');return false}
  if(edit){Object.assign(edit,{c:$('#aC').value,p:pv,msg:$('#aM').value.trim(),on:true})}else S.alarms.push({id:uid(),k,c:$('#aC').value,p:pv,msg:$('#aM').value.trim(),on:true,at:Date.now()});
  ls.set('alarms',S.alarms);refreshAlarmLines();renderAlarms();try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  toast('Alarm kuruldu',`${lbl(k)} · ${CONDS[$('#aC').value]} ${fmt(pv,dp)}`,'al',3000)}}])}
function checkAlarm(k,px){const prev=S.lastPx[k];S.lastPx[k]=px;if(prev==null)return;
 S.alarms.forEach(a=>{if(!a.on||a.k!==k)return;const upX=prev<a.p&&px>=a.p,dnX=prev>a.p&&px<=a.p;
  if((a.c==='up'&&upX)||(a.c==='down'&&dnX)||(a.c==='cross'&&(upX||dnX))){a.on=false;a.hit=Date.now();ls.set('alarms',S.alarms);fireAlarm(a,px)}})}
function fireAlarm(a,px){const dp=precOf(a.k),msg=`${lbl(a.k)} ${fmt(a.p,dp)} seviyesini ${px>=a.p?'yukarı':'aşağı'} kesti (şu an ${fmt(px,dp)})${a.msg?' · '+a.msg:''}`;
 toast('Alarm tetiklendi',msg,'al',20000);beep();try{if('Notification'in window&&Notification.permission==='granted')new Notification(APP_NAME+' alarmı',{body:msg})}catch(e){}
 renderAlarms();if(a.k===S.key)refreshAlarmLines()}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A();[0,.2,.4].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.16);o.start(a.currentTime+t);o.stop(a.currentTime+t+.18)})}catch(e){}}
function renderAlarms(){$('#al').innerHTML=S.alarms.length?S.alarms.slice().reverse().map(a=>`<div class="ali${a.on?'':' done'}" data-id="${esc(a.id)}"><span class="a1">${esc(lbl(a.k))} · ${fmt(a.p,precOf(a.k))}</span>
 <span class="ab"><button data-aa="edit" title="Düzenle / yeniden kur">${ic('edit')}</button><button data-aa="del" title="Sil">${ic('trash')}</button></span>
 <span class="a2">${esc(CONDS[a.c])}${a.on?'':' · tetiklendi'}${a.msg?' · '+esc(a.msg):''}</span></div>`).join(''):'<div class="empty">Henüz alarm yok. Grafikte sağ tıklayarak veya “Alarm” butonuyla oluşturun.</div>';
 const n=S.alarms.filter(a=>a.on).length;$('[data-st=al]').textContent='Alarmlar'+(n?` (${n})`:'')}
$('#al').addEventListener('click',e=>{const b=e.target.closest('[data-aa]');if(!b)return;const a=S.alarms.find(x=>x.id===b.closest('[data-id]').dataset.id);if(!a)return;
 if(b.dataset.aa==='del'){S.alarms=S.alarms.filter(x=>x!==a);ls.set('alarms',S.alarms);renderAlarms();refreshAlarmLines()}else alarmDlg(null,a)});
$('#alarmBtn').onclick=()=>alarmDlg();$('#newAlarm').onclick=()=>alarmDlg();

// ---------------- tekrar oynat ----------------
const rbar=$('#rbar');let rTimer=null;
$('#replayBtn').onclick=()=>{if(S.replay){exitReplay();return}if(!S.full.length)return;setTool('replay');$('#rhint').style.display='block'};
function startReplayAt(x){XF=xform();const n=S.full.length,i=Math.max(30,Math.min(n-2,Math.round(lOfX(x))));$('#rhint').style.display='none';
 S.replay={i,play:false,speed:1};S.data=S.full.slice(0,i+1);setTool('cursor');mainS.setData(mainData());computeAll(true);legend();renderRbar();
 main.timeScale().scrollToPosition(8,false);$('#replayBtn').classList.add('on');dirty()}
function rStep(){const r=S.replay;if(!r)return;if(r.i>=S.full.length-1){rPause();toast('Tekrar oynatma','Son muma ulaşıldı.','',3000);return}
 r.i++;S.data.push(S.full[r.i]);if(S.ctype==='ha')mainS.setData(mainData());else mainS.update(mainData().at(-1));computeAll(false);if(S.hover==null)legend();renderRbar()}
function rPlay(){const r=S.replay;r.play=true;clearInterval(rTimer);rTimer=setInterval(rStep,1000/r.speed);renderRbar()}
function rPause(){if(!S.replay)return;S.replay.play=false;clearInterval(rTimer);renderRbar()}
function exitReplay(silent){clearInterval(rTimer);S.replay=null;S.data=S.full;rbar.classList.remove('show');$('#replayBtn').classList.remove('on');if(silent)return;mainS.setData(mainData());computeAll(true);legend();main.timeScale().scrollToRealTime();dirty()}
function renderRbar(){const r=S.replay;if(!r){rbar.classList.remove('show');return}const c=S.full[r.i];
 rbar.innerHTML=`<button data-r="pp" title="${r.play?'Duraklat':'Oynat'}">${ic(r.play?'pause':'play')}</button><button data-r="st" title="İleri sar (1 mum)">${ic('next')}</button>
 <button data-r="sp" title="Hız">${r.speed}x</button><span class="rt">${esc(fmtTime(c.time))}</span><button data-r="jump" title="Yeni başlangıç seç">${ic('replay')}</button><button data-r="x" title="Tekrar oynatmadan çık">${ic('x')}</button>`;rbar.classList.add('show')}
rbar.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b||!S.replay)return;const a=b.dataset.r,r=S.replay;
 if(a==='pp')r.play?rPause():rPlay();if(a==='st'){rPause();rStep()}if(a==='x')exitReplay();
 if(a==='sp'){const sp=[.5,1,2,3,5,10];r.speed=sp[(sp.indexOf(r.speed)+1)%sp.length];if(r.play)rPlay();else renderRbar()}
 if(a==='jump'){rPause();S.data=S.full;mainS.setData(mainData());computeAll(true);setTool('replay');$('#rhint').style.display='block'}});

// ---------------- alt çubuk ----------------
const RANGES=[['1G','5m',1],['5G','15m',5],['1A','1h',30],['3A','4h',90],['6A','12h',182],['YB','1d','ytd'],['1Y','1d',365],['5Y','1w',1826],['Tümü','1M','all']];
function renderBot(){$('#bot').innerHTML=RANGES.map(r=>`<button data-rg="${r[0]}" title="Son ${r[0]}">${r[0]}</button>`).join('')+'<div class="grow"></div><span id="clock"></span><i class="sp"></i>'+
 `<button data-sc="pct" title="Yüzde ölçeği">%</button><button data-sc="log" title="Logaritmik ölçek">log</button><button data-sc="auto" class="on" title="Otomatik ölçek">oto</button>`}
function applyRange(r){const n=S.data;if(!n.length)return;const to=n.at(-1).time;let from;
 if(r[2]==='all'){main.timeScale().fitContent();return}if(r[2]==='ytd'){from=new Date(new Date().getFullYear(),0,1).getTime()/1000}else from=to-r[2]*86400;
 const l=Math.max(0,t2l(from));main.timeScale().setVisibleLogicalRange({from:l,to:n.length+5})}
let scMode=0;
$('#bot').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.rg){const r=RANGES.find(x=>x[0]===b.dataset.rg);if(S.tf!==r[1]){S.pendingRange=r;S.tf=r[1];ls.set('tf',S.tf);loadChart()}else applyRange(r);return}
 const sc=b.dataset.sc;if(sc==='auto'){main.priceScale('right').applyOptions({autoScale:true});b.classList.add('on');return}
 const m=sc==='pct'?2:1;scMode=scMode===m?0:m;main.priceScale('right').applyOptions({mode:scMode});$$('[data-sc=pct],[data-sc=log]').forEach(x=>x.classList.toggle('on',(x.dataset.sc==='pct'?2:1)===scMode));dirty()});
function tickClock(){const d=new Date(),o=-d.getTimezoneOffset()/60;const c=$('#clock');if(c)c.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} UTC${o>=0?'+':''}${o}`}
setInterval(tickClock,1000);

// ---------------- sağ tık menüsü ----------------
mainEl.addEventListener('contextmenu',e=>{e.preventDefault();const p=pos(e),price=pOfY(p.y);const g=e.target.closest&&e.target.closest('g.d');const items=[];
 if(g){const d=S.draws.find(x=>x.id===g.dataset.id);if(d){S.sel=d.id;dirty();items.push({h:TOOLS[d.type]||'Çizim'},{t:'Kopyala',ic:'copy',f:()=>dtb.querySelector('[data-da=copy]')?.click()},{t:d.lock?'Kilidi aç':'Kilitle',ic:'lock',f:()=>{snap();d.lock=!d.lock;saveDraws();dirty()}},{t:'Sil',ic:'trash',k:'Del',f:()=>{snap();S.draws=S.draws.filter(x=>x!==d);S.sel=null;saveDraws();dirty()}})}}
 if(price!=null){const fp=fmt(price);items.push({h:'Grafik'},{t:`${fp} fiyatına alarm ekle`,ic:'bell',f:()=>alarmDlg(price)},{t:`${fp} fiyatına yatay çizgi`,ic:'hline',f:()=>{snap();S.draws.push({id:uid(),type:'hline',pts:[{t:l2t(lOfX(p.x)),p:price}],st:defSt('hline')});saveDraws();dirty()}})}
 items.push({t:'Grafiği sıfırla',ic:'full',k:'Alt+R',f:resetView},{t:'Göstergeler…',ic:'fx',f:()=>$('#indBtn').click()},{t:'Ayarlar…',ic:'gear',f:settingsDlg});
 if(S.draws.length)items.push({t:'Tüm çizimleri kaldır',ic:'trash',f:()=>$('[data-t=clear]').click()});
 openPop(null,items,{x:e.clientX,y:e.clientY})});
function resetView(){const n=S.data.length;main.priceScale('right').applyOptions({autoScale:true});main.timeScale().setVisibleLogicalRange({from:n-150,to:n+12})}

// ---------------- ayarlar ----------------
function settingsDlg(){const s=S.set;dialog('Grafik ayarları',`<div class="fld"><label for="sT">Tema</label><select id="sT"><option value="dark"${s.theme==='dark'?' selected':''}>Koyu</option><option value="light"${s.theme==='light'?' selected':''}>Açık</option></select></div>
 <div class="fld"><label for="sU">Yükselen mum</label><input id="sU" type="color" value="${esc(s.up)}"></div><div class="fld"><label for="sD">Düşen mum</label><input id="sD" type="color" value="${esc(s.down)}"></div>
 <div class="fld"><label for="sG">Izgara çizgileri</label><input id="sG" type="checkbox"${s.grid?' checked':''}></div>
 <p style="color:var(--mu);font-size:12px">Saatler bilgisayarınızın saat diliminde gösterilir. Tüm ayarlar, çizimler ve alarmlar bu tarayıcıda saklanır.</p>
 <button class="btn r" id="sReset" style="margin-top:6px">Her şeyi sıfırla</button>`,
 [{t:'Vazgeç',cls:'g'},{t:'Uygula',f:()=>{Object.assign(S.set,{theme:$('#sT').value,up:$('#sU').value,down:$('#sD').value,grid:$('#sG').checked});ls.set('set',S.set);applyTheme()}}]);
 $('#sReset').onclick=()=>{closeModal('mDlg');confirmDlg('Her şeyi sıfırla','Tüm çizimler, göstergeler, alarmlar ve ayarlar silinecek. Emin misiniz?',()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('otc_')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()})}}
function applyTheme(){document.documentElement.dataset.theme=S.set.theme;$('meta[name=theme-color]').content=S.set.theme==='dark'?'#0f1218':'#ffffff';
 main.applyOptions(chartOpts(false));subs.forEach(p=>{const def=p.def;p.chart.applyOptions(chartOpts(true,def.dp==='main'?null:def.big?0:(def.dp??2)))});
 mkMain();rebuildInds();dirty()}
$('#cfgBtn').onclick=settingsDlg;

// ---------------- ekran görüntüsü ----------------
$('#shotBtn').onclick=async()=>{try{
 const parts=[main.takeScreenshot(),...subs.map(p=>p.chart.takeScreenshot())],w=parts[0].width,h=parts.reduce((s,c)=>s+c.height,0),r=parts[0].width/mainEl.clientWidth;
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');let y=0;parts.forEach(c=>{x.drawImage(c,0,y);y+=c.height});
 const s=new XMLSerializer().serializeToString(svg).replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"').replace(/var\(--bg\)/g,S.set.theme==='dark'?'#0f1218':'#ffffff');
 const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s.replace(/<svg([^>]*)>/,`<svg$1 width="${mainEl.clientWidth}" height="${mainEl.clientHeight}">`));await img.decode();x.drawImage(img,0,0,mainEl.clientWidth*r,mainEl.clientHeight*r);
 x.font=`${600} ${14*r}px Inter,sans-serif`;x.fillStyle=S.set.theme==='dark'?'#d1d4dc':'#131722';x.fillText(`${lbl(S.key)} · ${TFS.find(t=>t[0]===S.tf)?.[1]} · ${APP_NAME}`,10*r,22*r);
 const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=`${lbl(S.key)}_${S.tf}_${Date.now()}.png`;document.body.appendChild(a);a.click();a.remove();toast('Ekran görüntüsü','PNG dosyası indirildi.','',2500)
}catch(e){console.error(e);toast('Ekran görüntüsü alınamadı',String(e.message||e))}};

// ---------------- klavye & diğer ----------------
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('keydown',e=>{const inInput=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName),modal=$$('.modal.show').length;
 if(e.key==='Escape'){if(modal){$$('.modal.show').forEach(m=>m.classList.remove('show'));return}pop.classList.remove('show');if(S.pending||isDraw(S.tool))setTool('cursor');else if(S.sel){S.sel=null;dirty()}return}
 if(inInput||modal)return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
 if((e.key==='Delete'||e.key==='Backspace')&&S.sel){snap();S.draws=S.draws.filter(x=>x.id!==S.sel);S.sel=null;saveDraws();dirty();return}
 if(e.altKey){const m={t:'trend',h:'hline',j:'hray',v:'vline',f:'fib',x:'text'}[e.key.toLowerCase()];if(e.shiftKey&&e.key.toLowerCase()==='r'){e.preventDefault();setTool('rect');return}
  if(e.key.toLowerCase()==='r'&&!e.shiftKey){e.preventDefault();resetView();return}if(m){e.preventDefault();setTool(m)}return}
 if(e.key===' '&&S.replay){e.preventDefault();S.replay.play?rPause():rPlay();return}
 if(e.key==='ArrowRight'&&e.shiftKey&&S.replay){rPause();rStep();return}
 if(!e.ctrlKey&&!e.metaKey&&/^[a-z0-9]$/i.test(e.key)){e.preventDefault();openSym('pick',e.key.toUpperCase())}});
// Shift + tık = hızlı ölçüm
mainEl.addEventListener('pointerdown',e=>{if(e.shiftKey&&!isDraw(S.tool)&&e.button===0&&!e.target.closest('#dtb,#rbar,.ib,.lgc')){e.stopPropagation();setTool('measure');onDown(e)}},true);
$$('.stabs button').forEach(b=>b.onclick=()=>{$$('.stabs button').forEach(x=>x.classList.toggle('on',x===b));$$('.spane').forEach(p=>p.classList.toggle('on',p.id==='sp-'+b.dataset.st))});
function setMob(m){$('#side').classList.toggle('show',m==='side');$$('#mtabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
$('#mtabs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)setMob(b.dataset.m)});

// ---------------- başlat ----------------
$('#brand').textContent=APP_NAME;paintIcons();renderTfFav();renderTools();renderBot();tickClock();renderAlarms();
document.documentElement.dataset.theme=S.set.theme;
mkMain();rebuildInds();setTool(S.cursor);updUndo();loop();
(async()=>{await loadSymbols();renderWl();renderDet();await loadChart();openTicker('F');openTicker('S');updWl()})();

}
</script>
