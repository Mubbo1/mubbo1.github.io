name: aab-indir
on:
  push:
    paths: ['kur-7f3a9c/aab-url.txt']
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o kur-7f3a9c/play/app-release.aab "$(cat kur-7f3a9c/aab-url.txt)"
          ls -la kur-7f3a9c/play/app-release.aab
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add kur-7f3a9c/play/app-release.aab && git commit -m "aab (gecici)" && git push
